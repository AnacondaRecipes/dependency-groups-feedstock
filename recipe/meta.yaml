{% set name = "dependency-groups" %}
{% set version = "1.3.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: c81831f43828dbc3987ee247eb198241a0152b8e7ceab10977cc3808eb388ac7

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<39]
  entry_points:
    - lint-dependency-groups = dependency_groups._lint_dependency_groups:main
    - pip-install-dependency-groups = dependency_groups._pip_wrapper:main
    - dependency-groups = dependency_groups.__main__:main

requirements:
  host:
    - python
    - pip
    - flit-core >=3.11
  run:
    - python
    - packaging
    - tomli  # [py<311]

test:
  source_files:
    - tests
  imports:
    - dependency_groups
  commands:
    - pip check
    - lint-dependency-groups --help
    - pip-install-dependency-groups --help
    - dependency-groups --help
    - pytest -vv tests
  requires:
    - pip
    - python
    - pytest

about:
  home: https://dependency-groups.readthedocs.io
  summary: A tool for resolving PEP 735 Dependency Group data
  description: |
    This is a library which is able to parse dependency groups, following includes, and provide that data as output.
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  doc_url: https://dependency-groups.readthedocs.io
  dev_url: https://github.com/pypa/dependency-groups

extra:
  recipe-maintainers:
    - AddYourGitHubIdHere
